name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release auf GitHub veröffentlicht („Draft a new release“, Tag vX.Y.Z): Image mit dieser Versionsnummer.
  release:
    types: [published]

permissions:
  contents: read

# Neuer Push auf denselben PR-Branch bricht den älteren, noch laufenden Lauf ab.
# main und Releases bekommen je Lauf eine eigene Gruppe, damit kein wartender Lauf
# ersetzt wird und jedes Image gebaut wird.
concurrency:
  group: ci-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAILWIND_VERSION: v4.1.14

jobs:
  build-test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tailwind holen
        run: |
          curl -sSLo tools/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tools/tailwindcss

      - run: dotnet restore

      # V71: bekannte Sicherheitslücken in direkten und indirekten NuGet-Paketen brechen den Lauf.
      - name: Pakete mit bekannten Sicherheitslücken
        run: |
          dotnet list Fevad.slnx package --vulnerable --include-transitive 2>&1 | tee pakete.txt
          if grep -q "has the following vulnerable packages" pakete.txt; then
            echo "::error::Mindestens ein Paket hat eine bekannte Sicherheitslücke (siehe oben)."
            exit 1
          fi

      - run: dotnet build --no-restore -c Release

      - name: Migrationen vollständig
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Fevad.Infrastructure --startup-project src/Fevad.Web --no-build --configuration Release
        env:
          ConnectionStrings__Datenbank: "Host=localhost;Database=dummy"

      # V71: Chromium für die Oberflächentests (OberflaechenTests), passend zur Playwright-Version des Testprojekts.
      - name: Browser für Oberflächentests
        run: pwsh tests/Fevad.Integration.Tests/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      # Integrationstests starten PostgreSQL per Testcontainers; Docker ist auf ubuntu-latest vorhanden.
      - run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testergebnisse
          path: TestResults
          retention-days: 7

  betrieb:
    name: Betriebsdateien
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Skripte (shellcheck)
        working-directory: deploy
        run: shellcheck -x *.sh lib.sh
      - name: Compose-Datei und Caddyfile
        working-directory: deploy
        run: |
          printf 'FEVAD_DOMAIN=fevad.example.de\nACME_EMAIL=admin@example.de\nPOSTGRES_PASSWORD=x\n' > ci.env
          cat env.beispiel ci.env > .env
          docker compose -f compose.yml --env-file .env config -q
          docker run --rm -e FEVAD_DOMAIN=fevad.example.de -e ACME_EMAIL=admin@example.de \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.10 caddy validate --config /etc/caddy/Caddyfile

  image:
    name: Container-Image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # alle Tags, für die Entwicklungsversion

      # Die Versionsnummer kommt vom GitHub-Release (Tag vX.Y.Z). Zwischen zwei Releases trägt main
      # die nächste Patch-Version mit Zusatz, z. B. 0.1.1-dev.4 = vier Commits nach v0.1.0.
      - name: Version bestimmen
        id: version
        run: |
          zahl='(0|[1-9][0-9]*)'
          semver="^v$zahl\.$zahl\.$zahl(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
              echo "::error::Release-Tag $GITHUB_REF_NAME ist keine Versionsnummer der Form v1.2.3 oder v1.2.3-beta.1"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            # Letztes reguläres Release vor diesem Commit; fehlerhafte Tags und Vorabversionen zählen nicht.
            letztes=$(git tag --merged HEAD --sort=-v:refname | grep -E "^v$zahl\.$zahl\.$zahl$" | head -n 1 || true)
            if [[ -z "$letztes" ]]; then
              version="0.0.0-dev.$(git rev-list --count HEAD)"
            else
              IFS=. read -r major minor patch <<< "${letztes#v}"
              version="$major.$minor.$((patch + 1))-dev.$(git rev-list --count "$letztes"..HEAD)"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Image-Name (GHCR verlangt Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fevad" >> "$GITHUB_OUTPUT"

      # main: latest und Commit; Release v1.2.3: 1.2.3, Commit und stable (für Gerätehaus-PC und VPS).
      # Ein als Vorabversion markiertes Release bekommt kein stable.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=FEVAD
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # V71: Image vorab lokal bauen und auf kritische, behebbare Lücken im Basis-Image und in den Paketen prüfen.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: fevad:pruefung
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha
      - name: Sicherheitsprüfung des Images (Trivy)
        # Fremde Action auf einen Commit (v0.36.0) festgelegt, damit ein umgehängter Tag nichts anderes ausführt.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: fevad:pruefung
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - uses: docker/build-push-action@v7
        with:
          context: .
          # Bei Pull Requests nur bauen, auf main und bei Releases zusätzlich nach GHCR veröffentlichen.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
