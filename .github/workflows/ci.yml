name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAILWIND_VERSION: v4.1.14

jobs:
  build-test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tailwind holen
        run: |
          curl -sSLo tools/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tools/tailwindcss

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Migrationen vollständig
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Fevad.Infrastructure --startup-project src/Fevad.Web --no-build --configuration Release
        env:
          ConnectionStrings__Datenbank: "Host=localhost;Database=dummy"

      # Integrationstests starten PostgreSQL per Testcontainers; Docker ist auf ubuntu-latest vorhanden.
      - run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testergebnisse
          path: TestResults

  image:
    name: Container-Image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Version aus Directory.Build.props
        id: version
        run: |
          version=$(sed -n 's:.*<VersionPrefix>\(.*\)</VersionPrefix>.*:\1:p' Directory.Build.props)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # Ein Release-Tag muss zur Version im Repo passen, sonst trägt das Image eine falsche Nummer.
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME passt nicht zu VersionPrefix $version in Directory.Build.props"
            exit 1
          fi

      - name: Image-Name (GHCR verlangt Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fevad" >> "$GITHUB_OUTPUT"

      # main: latest und Commit; Release-Tag v1.2.3: 1.2.3, Commit und stable (für Gerätehaus-PC und VPS).
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=FEVAD
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Bei Pull Requests nur bauen, auf main und bei Release-Tags zusätzlich nach GHCR veröffentlichen.
          push: ${{ github.event_name == 'push' }}
          build-args: |
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub-Release
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Release mit Abschnitt aus CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## \[/ { aktiv = index($0, "[" v "]") > 0; next } /^\[/ { aktiv = 0 } aktiv' CHANGELOG.md > notizen.md
          if [[ ! -s notizen.md ]]; then
            echo "::error::CHANGELOG.md hat keinen Abschnitt [$version]"
            exit 1
          fi
          vorab=""
          [[ "$version" == *-* ]] && vorab="--prerelease"
          gh release create "$GITHUB_REF_NAME" --title "FEVAD $version" --notes-file notizen.md --verify-tag $vorab
