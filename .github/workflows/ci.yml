name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Release auf GitHub veröffentlicht („Draft a new release“, Tag vX.Y.Z): Image mit dieser Versionsnummer.
  release:
    types: [published]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  TAILWIND_VERSION: v4.1.14

jobs:
  build-test:
    name: Build und Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Tailwind holen
        run: |
          curl -sSLo tools/tailwindcss "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x tools/tailwindcss

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release

      - name: Migrationen vollständig
        run: |
          dotnet tool restore
          dotnet ef migrations has-pending-model-changes --project src/Fevad.Infrastructure --startup-project src/Fevad.Web --no-build --configuration Release
        env:
          ConnectionStrings__Datenbank: "Host=localhost;Database=dummy"

      # Integrationstests starten PostgreSQL per Testcontainers; Docker ist auf ubuntu-latest vorhanden.
      - run: dotnet test --no-build -c Release --logger "trx" --results-directory TestResults

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: testergebnisse
          path: TestResults

  image:
    name: Container-Image
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # alle Tags, für die Entwicklungsversion

      # Die Versionsnummer kommt vom GitHub-Release (Tag vX.Y.Z). Zwischen zwei Releases trägt main
      # die nächste Patch-Version mit Zusatz, z. B. 0.1.1-dev.4 = vier Commits nach v0.1.0.
      - name: Version bestimmen
        id: version
        run: |
          zahl='(0|[1-9][0-9]*)'
          semver="^v$zahl\.$zahl\.$zahl(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$"
          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            if [[ ! "$GITHUB_REF_NAME" =~ $semver ]]; then
              echo "::error::Release-Tag $GITHUB_REF_NAME ist keine Versionsnummer der Form v1.2.3 oder v1.2.3-beta.1"
              exit 1
            fi
            version="${GITHUB_REF_NAME#v}"
          else
            # Letztes reguläres Release vor diesem Commit; fehlerhafte Tags und Vorabversionen zählen nicht.
            letztes=$(git tag --merged HEAD --sort=-v:refname | grep -E "^v$zahl\.$zahl\.$zahl$" | head -n 1 || true)
            if [[ -z "$letztes" ]]; then
              version="0.0.0-dev.$(git rev-list --count HEAD)"
            else
              IFS=. read -r major minor patch <<< "${letztes#v}"
              version="$major.$minor.$((patch + 1))-dev.$(git rev-list --count "$letztes"..HEAD)"
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Image-Name (GHCR verlangt Kleinbuchstaben)
        id: name
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fevad" >> "$GITHUB_OUTPUT"

      # main: latest und Commit; Release v1.2.3: 1.2.3, Commit und stable (für Gerätehaus-PC und VPS).
      # Ein als Vorabversion markiertes Release bekommt kein stable.
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.name.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=
            type=semver,pattern={{version}}
            type=raw,value=stable,enable=${{ github.event_name == 'release' && !github.event.release.prerelease }}
          labels: |
            org.opencontainers.image.title=FEVAD
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          # Bei Pull Requests nur bauen, auf main und bei Releases zusätzlich nach GHCR veröffentlichen.
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
